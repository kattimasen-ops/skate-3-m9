name: Build Skate3 PortMaster (RK3326 / M9 Pro)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build aarch64 PortMaster package
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      RUSTUP_TOOLCHAIN: stable
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # Cortex-A35 (RK3326):
      #   -C target-cpu=cortex-a35     aktiviert CRC + ARMv8-A-Features
      #   -C target-feature=-outline-atomics  PFLICHT, sonst SIGILL
      #                                          (A35 hat keine LSE-Atomics)
      #   --gc-sections / --as-needed  entfernt ungenutzten Code
      #   -static-libgcc               libc bleibt dynamisch (glibc 2.31)
      RUSTFLAGS: >-
        -C target-cpu=cortex-a35
        -C target-feature=-outline-atomics
        -C link-arg=-Wl,--gc-sections
        -C link-arg=-Wl,--as-needed
        -C link-arg=-Wl,-O2
        -C link-arg=-static-libgcc
        -C panic=abort
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      JOBS: "4"
      PORT_NAME: "skate3"
      PORT_TITLE: "Skate 3"
      MAX_GLIBC: "2.30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # ═══════════════════════════════════════════════════════════════
      # STRUKTUR-CHECK (wie WOTS2)
      # ═══════════════════════════════════════════════════════════════
      - name: Repo-Struktur prüfen
        run: |
          set -euo pipefail
          echo "== Root =="; ls -la
          echo ""
          echo "== Cargo.toml (Workspace) =="
          cat Cargo.toml
          echo ""
          echo "== Vorhandene Crates =="
          for d in crates/*/; do
            if [ -f "${d}Cargo.toml" ]; then
              echo "  OK: $d"
            else
              echo "  WARNUNG: $d ohne Cargo.toml"
            fi
          done
          echo ""
          echo "== Vita-Reste =="
          [ -f .cargo/config.toml ] && { echo "  .cargo/config.toml vorhanden:"; cat .cargo/config.toml; } || echo "  keine .cargo/config.toml"
          [ -f rust-toolchain.toml ] && { echo "  rust-toolchain.toml vorhanden:"; cat rust-toolchain.toml; } || echo "  keine rust-toolchain.toml"
          echo ""
          echo "== Fehlende Mitglieder prüfen =="
          MISSING=0
          for m in $(grep -oE 'crates/[a-zA-Z0-9_-]+' Cargo.toml | sort -u); do
            if [ ! -f "$m/Cargo.toml" ]; then
              echo "  FEHLT: $m"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Cargo.toml referenziert nicht existierende Crates"
            exit 1
          fi

      - name: Vita-Toolchain-Dateien neutralisieren
        run: |
          set -euo pipefail
          for f in rust-toolchain rust-toolchain.toml; do
            if [ -f "$f" ]; then
              mv "$f" "$f.disabled-for-aarch64"
              echo "Deaktiviert: $f"
            fi
          done
          if [ -f .cargo/config.toml ]; then
            cp .cargo/config.toml .cargo/config.toml.vita-backup
            echo "Backup: .cargo/config.toml.vita-backup"
          fi

      - name: aarch64 Multiarch aktivieren
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: aarch64 Dev-Pakete installieren
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu pkg-config curl ca-certificates \
            file patchelf zip unzip \
            libasound2-dev:arm64 libudev-dev:arm64 \
            libdrm-dev:arm64 libgbm-dev:arm64 \
            libegl-dev:arm64 libgles2-mesa-dev:arm64

      - name: Rust installieren
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version

      - name: aarch64-Target hinzufügen
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-unknown-linux-gnu

      # ─────────────────────────────────────────────────────────────
      # OPTIONAL: Harte glibc-Pin via cargo-zigbuild.
      # Aktivieren, indem du die Kommentarzeichen entfernst UND den
      # Standard-Build-Step überspringst. Vorteil: glibc-Version wird
      # im Linker erzwungen (nicht nur im Container implizit).
      # Nachteil: Zig-Installation (~50 MB) verlängert den Build.
      #
      # - name: Zig + cargo-zigbuild installieren
      #   run: |
      #     set -euo pipefail
      #     export PATH="$HOME/.cargo/bin:$PATH"
      #     pip3 install ziglang
      #     cargo install cargo-zigbuild --locked
      #
      # - name: Cargo Build mit glibc-Pin
      #   run: |
      #     set -euo pipefail
      #     export PATH="$HOME/.cargo/bin:$PATH"
      #     cargo zigbuild --release \
      #       --target aarch64-unknown-linux-gnu.2.30 \
      #       --workspace \
      #       --jobs "$JOBS" 2>&1 | tee build.log
      # ─────────────────────────────────────────────────────────────

      - name: Cargo Build (aarch64, workspace)
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build \
            --release \
            --target aarch64-unknown-linux-gnu \
            --workspace \
            --jobs "$JOBS" \
            2>&1 | tee build.log

      - name: Release-Binaries auflisten
        if: always()
        run: |
          set -euo pipefail
          echo "== Release-Verzeichnis =="
          ls -la target/aarch64-unknown-linux-gnu/release/ 2>/dev/null || true
          echo ""
          echo "== Ausführbare Binaries (Top-Level) =="
          find target/aarch64-unknown-linux-gnu/release -maxdepth 1 \
            -type f -executable ! -name "*.so*" ! -name "*.d" 2>/dev/null || true

      - name: glibc 2.30 prüfen
        run: |
          set -euo pipefail
          BIN_DIR=target/aarch64-unknown-linux-gnu/release
          BINS=$(find "$BIN_DIR" -maxdepth 1 -type f -executable \
                 ! -name "*.so*" ! -name "*.d" 2>/dev/null)
          if [ -z "$BINS" ]; then
            echo "::error::Kein ausführbares Binary in $BIN_DIR gefunden"
            exit 1
          fi
          FAIL=0
          for BIN in $BINS; do
            echo "== Prüfe: $BIN =="
            file "$BIN"
            MAX=$(aarch64-linux-gnu-objdump -T "$BIN" \
              | { grep -oE 'GLIBC_[0-9][0-9.]*' || true; } \
              | sed 's/^GLIBC_//' | sort -Vu | tail -1)
            echo "  Höchste GLIBC-Version: ${MAX:-keine}"
            if [ -n "$MAX" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$MAX" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "  ::error::Braucht GLIBC_$MAX, ArkOS hat nur $MAX_GLIBC"
              FAIL=1
            else
              echo "  OK (<= GLIBC_$MAX_GLIBC)"
            fi
          done
          exit $FAIL

      # ═══════════════════════════════════════════════════════════════
      # PORTMASTER-PAKET VORBEREITEN
      # ═══════════════════════════════════════════════════════════════
      - name: PortMaster-Paket vorbereiten
        if: always()
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          PORT_DIR="$STAGE/$PORT_NAME"
          rm -rf "$STAGE"
          mkdir -p "$PORT_DIR/$PORT_NAME/assets" "$PORT_DIR/$PORT_NAME/libs.aarch64"

          BIN_SRC=""
          for cand in \
            target/aarch64-unknown-linux-gnu/release/skate-vita \
            target/aarch64-unknown-linux-gnu/release/skate3 \
            target/aarch64-unknown-linux-gnu/release/skate; do
            [ -f "$cand" ] && [ -x "$cand" ] && BIN_SRC="$cand" && break
          done
          if [ -z "$BIN_SRC" ]; then
            BIN_SRC=$(find target/aarch64-unknown-linux-gnu/release -maxdepth 1 \
              -type f -executable ! -name "*.so*" ! -name "*.d" | head -n 1)
          fi
          if [ -z "$BIN_SRC" ]; then
            echo "::error::Kein Skate-3-Binary gefunden"
            exit 1
          fi
          echo "Binary: $BIN_SRC"
          install -m 755 "$BIN_SRC" "$PORT_DIR/$PORT_NAME/$PORT_NAME"
          strip --strip-unneeded "$PORT_DIR/$PORT_NAME/$PORT_NAME" 2>/dev/null || true

          for lib in target/aarch64-unknown-linux-gnu/release/*.so*; do
            [ -e "$lib" ] && cp -a "$lib" "$PORT_DIR/$PORT_NAME/libs.aarch64/" || true
          done

          touch "$PORT_DIR/$PORT_NAME/assets/.gitkeep"
          echo "PORT_DIR=$PORT_DIR" >> "$GITHUB_ENV"

      - name: Launcher-Skript schreiben
        run: |
          set -euo pipefail
          PORT_DIR="$GITHUB_WORKSPACE/dist/$PORT_NAME"
          cat > "$PORT_DIR/Skate 3.sh" <<'LAUNCHER'
#!/bin/bash
# Skate 3 — PortMaster Launcher für RK3326 / M9 Pro / ArkOS4Clone
set -euo pipefail

XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
SCRIPT_DIR="$(cd "$(dirname "$0")" 2>/dev/null && pwd)"
GAMEDIR="$SCRIPT_DIR/skate3"

if [ ! -x "$GAMEDIR/skate3" ]; then
    echo "FEHLER: $GAMEDIR/skate3 fehlt." >&2
    exit 1
fi

controlfolder=""
for candidate in \
    "/opt/system/Tools/PortMaster" \
    "/opt/tools/PortMaster" \
    "$XDG_DATA_HOME/PortMaster" \
    "/roms/ports/PortMaster" \
    "/roms/tools/PortMaster"; do
    [ -d "$candidate" ] && controlfolder="$candidate" && break
done

if [ -n "$controlfolder" ] && [ -f "$controlfolder/control.txt" ]; then
    # shellcheck disable=SC1090
    source "$controlfolder/control.txt"
    [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
fi

export SDL_VIDEODRIVER="${SDL_VIDEODRIVER:-kmsdrm}"
unset SDL_AUDIODRIVER AUDIODEV

if [ -n "${sdl_controllerconfig:-}" ]; then
    export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
fi
if [ -n "${SDL_GAMECONTROLLERCONFIG:-}" ]; then
    export SDL_GAMECONTROLLERCONFIG_FILE="/tmp/skate3-gamecontrollerdb.txt"
    printf '%s\n' "$SDL_GAMECONTROLLERCONFIG" > "$SDL_GAMECONTROLLERCONFIG_FILE" 2>/dev/null || true
fi

# Mali-Symlinks (wie WOTS2)
SYSTEM_MALI=""
for candidate in \
    /usr/lib/aarch64-linux-gnu/libmali-bifrost-g31-rxp0-gbm.so \
    /usr/local/lib/aarch64-linux-gnu/libmali-bifrost-g31-rxp0-gbm.so \
    /usr/lib/aarch64-linux-gnu/libmali.so.1 \
    /usr/lib/aarch64-linux-gnu/libmali.so \
    /usr/lib/aarch64-linux-gnu/libEGL.so.1; do
    [ -f "$candidate" ] && SYSTEM_MALI="$candidate" && break
done
if [ -n "$SYSTEM_MALI" ]; then
    rm -rf /tmp/skate3-mali
    mkdir -p /tmp/skate3-mali
    for name in libmali.so.0 libmali.so.1 libmali.so libEGL.so.1 libEGL.so libGLESv2.so.2 libGLESv2.so; do
        ln -sf "$SYSTEM_MALI" "/tmp/skate3-mali/$name"
    done
    export LD_LIBRARY_PATH="/tmp/skate3-mali:$GAMEDIR/libs.aarch64:$GAMEDIR:/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
else
    export LD_LIBRARY_PATH="$GAMEDIR/libs.aarch64:$GAMEDIR:/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
fi

# Runtime-Tuning (WOTS2-Erkenntnisse)
export MALLOC_TRIM_THRESHOLD_=131072
export MALLOC_MMAP_THRESHOLD_=131072
export SDL_KMSDRM_DOUBLE_BUFFER=1
export SDL_AUDIO_SAMPLES="${SDL_AUDIO_SAMPLES:-2048}"

# Skate-3-spezifische Performance-Defaults (Vita + WOTS2 Hebel)
export SKATE3_NO_VSYNC=1
export SKATE3_NO_SHADOW=1
export SKATE3_NO_POST=0
export SKATE3_RENDER_WIDTH=448
export SKATE3_RENDER_HEIGHT=336
export SKATE3_NPC_DRAW_DIST=10
export SKATE3_TRAFFIC_DENSITY=0.25
export SKATE3_PED_DENSITY=0.25

# CPU/GPU-Governor (wie WOTS2)
cpu_gov=""
for c in /sys/devices/system/cpu/cpufreq/policy0/scaling_governor \
         /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor; do
    [ -w "$c" ] && cpu_gov="$c" && break
done
[ -n "$cpu_gov" ] && echo performance > "$cpu_gov" 2>/dev/null || true

# gptokeyb Killswitch
GPTOKEYB=""
for c in "$controlfolder/gptokeyb" /opt/system/Tools/PortMaster/gptokeyb \
         /usr/local/bin/gptokeyb /usr/bin/gptokeyb; do
    [ -x "$c" ] && GPTOKEYB="$c" && break
done
if [ -n "$GPTOKEYB" ]; then
    "$GPTOKEYB" "$GAMEDIR/skate3" -k skate3 &
    GPTOKEYB_PID=$!
fi

cd "$GAMEDIR"
./skate3 "$@" || STATUS=$?

[ -n "${GPTOKEYB_PID:-}" ] && kill -TERM "$GPTOKEYB_PID" 2>/dev/null || true
[ -n "$cpu_gov" ] && echo ondemand > "$cpu_gov" 2>/dev/null || true

exit ${STATUS:-0}
LAUNCHER
          chmod 755 "$PORT_DIR/Skate 3.sh"

      - name: port.json schreiben
        run: |
          set -euo pipefail
          PORT_DIR="$GITHUB_WORKSPACE/dist/$PORT_NAME"
          cat > "$PORT_DIR/port.json" <<'JSON'
{
  "version": 4,
  "name": "skate3.zip",
  "items": [
    "Skate 3.sh",
    "skate3"
  ],
  "items_opt": [],
  "attr": {
    "title": "Skate 3",
    "porter": [
      "kattimasen-ops"
    ],
    "desc": "Skate 3 native ARM64 port for RK3326 (M9 Pro / ArkOS). Based on the skate-3-rust-engine decompilation. Requires your own Xbox 360 ISO to generate the .pak assets.",
    "desc_md": null,
    "inst": "Copy your converted .pak files into the skate3/assets/ folder. See README for the full conversion guide.",
    "inst_md": null,
    "genres": [
      "sports"
    ],
    "image": null,
    "rtr": false,
    "exp": true,
    "runtime": [],
    "store": [],
    "availability": "full",
    "reqs": [],
    "arch": [
      "aarch64"
    ],
    "min_glibc": "2.30"
  }
}
JSON

      - name: README.md schreiben
        run: |
          set -euo pipefail
          PORT_DIR="$GITHUB_WORKSPACE/dist/$PORT_NAME"
          cat > "$PORT_DIR/README.md" <<'MD'
## Skate 3 — RK3326 Port

Native ARM64 port of **Skate 3** for the **M9 Pro / RK3326 / ArkOS4Clone**, built from the [skate-3-rust-engine](https://github.com/SK8-ENGINE/skate-3-rust-engine) decompilation and the [skate-3-vita](https://github.com/irolup/skate-3-vita) port.

### ⚠️ You need your own game data
This port contains **no game assets**. You must own an Xbox 360 copy of Skate 3 and convert it to `.pak` files on a Linux machine (Termux + proot-distro works on Android).

1. Extract your ISO with `extract-xiso`.
2. Run `prepare_assets.py` from the engine repo.
3. Run `vita-bake` to produce the `.pak` files.
4. Copy the `.pak` files into `skate3/assets/`.

Full guide: [skate-3-vita README](https://github.com/irolup/skate-3-vita#making-your-own-game-data).

### Controls
| Button | Action |
|---|---|
| Left stick | Skate / steer |
| A | Ollie |
| X | Grab |
| B | Push |
| Y | Trick modifier |
| Start | Pause |

### Performance notes (RK3326)
- Render resolution: **448×336**
- Shadows: **off**
- NPC draw distance: **10u**
- Traffic/pedestrian density: **25 %**
- V-Sync: **off**

### Thanks
- **dumbad** for the years of Skate 3 reverse engineering.
- **acklavidian / SK8-ENGINE** for the Rust engine.
- **irolup** for the Vita port.
- **St0len-One** for the RK3326 WOTS2 port.

### License
GPL-3.0-only. Skate and Skate 3 belong to EA. This is an unofficial fan project.
MD

      - name: gameinfo.xml schreiben
        run: |
          set -euo pipefail
          PORT_DIR="$GITHUB_WORKSPACE/dist/$PORT_NAME"
          cat > "$PORT_DIR/gameinfo.xml" <<'XML'
<?xml version="1.0"?>
