    <developer>EA Black Box</developer>
    <publisher>Electronic Arts</publisher>
    <genre>Sports</genre>
    <players>1</players>
  </game>
</gameList>
XML

      - name: Screenshot-Platzhalter erzeugen
        run: |
          set -euo pipefail
          PORT_DIR="$GITHUB_WORKSPACE/dist/$PORT_NAME"
          apt-get install -y --no-install-recommends imagemagick 2>/dev/null || true
          if command -v convert >/dev/null 2>&1; then
            convert -size 640x480 xc:black "$PORT_DIR/screenshot.jpg" 2>/dev/null || true
          fi
          if [ ! -f "$PORT_DIR/screenshot.jpg" ]; then
            printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xdb\x00C\x00\x08\x06\x06\x07\x06\x05\x08\x07\x07\x07\t\t\x08\n\x0c\x14\r\x0c\x0b\x0b\x0c\x19\x12\x13\x0f\x14\x1d\x1a\x1f\x1e\x1d\x1a\x1c\x1c $.\' \",#\x1c\x1c(7),01444\x1f\'9=82<.342\xff\xc0\x00\x0b\x08\x00\x01\x00\x01\x01\x01\x11\x00\xff\xc4\x00\x14\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xff\xc4\x00\x14\x10\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xff\xda\x00\x08\x01\x01\x00\x00?\x00\xd2\xcf \xff\xd9' > "$PORT_DIR/screenshot.jpg"
          fi

      - name: PortMaster-ZIP erstellen
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          cd "$STAGE"
          zip -r "skate3.zip" "$PORT_NAME" -x "*.git*"
          unzip -l "skate3.zip" | head -40
          ls -lah "skate3.zip"

      - name: Artefakt hochladen (PortMaster-ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: skate3-portmaster
          path: dist/skate3.zip
          retention-days: 30
          if-no-files-found: error

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skate3-build-log
          path: build.log
          retention-days: 14
          if-no-files-found: warn
