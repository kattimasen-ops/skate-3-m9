[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# ── Vererbbare Metadaten für alle Crates ─────────────────────────────
# Diese Felder werden von den Crate-Cargo.toml via `.workspace = true`
# referenziert. Fehlt eines, bricht `cargo build` mit
# "workspace.package.<feld> was not defined" ab.
#
# HINWEIS ZUR LIZENZ: "MIT" ist ein funktionierender Platzhalter.
# Passe ihn an die tatsächliche Lizenz deines Forks an (z. B. GPL-3.0,
# Apache-2.0). Die Lizenz muss zu der des Upstream-Repos passen –
# prüfe irolup/skate-3-vita und SK8-ENGINE/skate-3-rust-engine.
license = "MIT"
authors = ["Skate 3 M9 Port Contributors"]
description = "Skate 3 native port for RK3326 (M9 Pro / ArkOS)"
repository = "https://github.com/kattimasen-ops/skate-3-m9"
homepage = "https://github.com/kattimasen-ops/skate-3-m9"
readme = "README.md"
keywords = ["skate", "game", "port", "aarch64", "rk3326"]
categories = ["games"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = false
debug = 1
