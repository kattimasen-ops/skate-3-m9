[workspace]
members = [
    "crates/skate-core",
    "crates/skate-audio",
    "crates/skate-audio-fma",
    "crates/skate-data",
    "crates/skate-game",
    "crates/skate-dynamics",
    "crates/skate-mods",
    "crates/skate-net",
    "crates/skate-steam-relay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "=0.18.1", default-features = false, features = [
    "bevy_asset",
    "bevy_scene",
    "bevy_animation",
    "bevy_audio",
    "bevy_gilrs",
    "multi_threaded",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = false
debug = 1

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
sdl3-sys = { path = "vendor/sdl3-sys" }
