[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

license = "MIT"
authors = ["Skate 3 M9 Port Contributors"]
description = "Skate 3 native port for RK3326 (M9 Pro / ArkOS)"
repository = "https://github.com/kattimasen-ops/skate-3-m9"
homepage = "https://github.com/kattimasen-ops/skate-3-m9"
readme = "README.md"
keywords = ["skate", "game", "port", "aarch64", "rk3326"]
categories = ["games"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = false
debug = 1

# Wird vom Workflow befüllt: wgpu-hal als Vendor-Crate
[patch.crates-io]
# wgpu-hal = { path = "vendor/wgpu/wgpu-hal" }
